name: 가산 점심 메뉴 자동 업데이트

on:
  schedule:
    # 평일 한국시간 09:00 ~ 11:40, 10분 간격
    # GitHub Actions는 UTC 기준 (한국시간 - 9시간), 요일 필드는 1=월 ~ 5=금
    - cron: '*/10 0-1 * * 1-5'
    - cron: '0,10,20,30,40 2 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: 메뉴 수집
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python lunchmap.py

      - name: 변경사항 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "자동 메뉴 업데이트"

          git push

name: Update Lunch Menu

on:
  schedule:
    # 평일(월~금) UTC 0~1시 (KST 9~10시) 매 10분마다
    - cron: '*/10 0-1 * * 1-5'
    # 평일(월~금) UTC 2시 (KST 11시) 0, 10, 20, 30, 40분에
    - cron: '0,10,20,30,40 2 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  update-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브에 파일 쓰기/푸시 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lunchmap script
        run: python lunchmap.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          # 변경사항이 있을 때만 커밋
          git diff --staged --quiet || git commit -m "Auto-update lunch menu"
          git push

name: Update Lunch Menu

on:
  schedule:
    # 남들이 잘 안 쓰는 3분 단위로 비틀기 (KST 기준 09:03, 09:13, 09:23 ...)
    - cron: '3,13,23,33,43,53 0-1 * * 1-5'
    # KST 기준 11:03, 11:13, 11:23, 11:33, 11:43
    - cron: '3,13,23,33,43 2 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  update-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lunchmap script
        run: python lunchmap.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          # 수집한 메뉴 데이터에 변경사항이 있을 때만 푸시합니다.
          git diff --staged --quiet || git commit -m "Auto-update lunch menu"
          git push

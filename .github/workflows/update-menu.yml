name: Update Lunch Menu

on:
  workflow_dispatch: # 외부 스케줄러(cron-job.org)가 이 이벤트를 호출해서 실행시킵니다

jobs:
  update-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lunchmap script
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python lunchmap.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 수집한 메뉴 데이터에 변경사항이 있을 때만 커밋합니다.
          git diff --staged --quiet || git commit -m "Auto-update lunch menu"

          # 그 사이 다른 실행이 먼저 push했을 수 있으니, 최신 내용을 받아온 뒤 재시도
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push 충돌, ${i}번째 재시도..."
            sleep 5
          done

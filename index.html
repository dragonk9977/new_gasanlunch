<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가산 점심 메뉴 지도</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;color:#222;background:#f5f6f8}
body{overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 18px;z-index:10}
.title{font-size:20px;font-weight:800;white-space:nowrap}
.date{margin-left:12px;color:#777;font-size:13px}
.actions{margin-left:auto;display:flex;gap:8px}
button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}
button:hover{background:#f3f4f6}
.primary{background:#222;color:#fff;border-color:#222}
.primary:hover{background:#000}
#map{flex:1;min-height:0}
.bottom-panel{background:#fff;border-top:1px solid #ddd;padding:12px 14px 14px;z-index:5}
.status{font-size:12px;color:#777;margin:0 0 9px}
.cards{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.card{flex:0 0 270px;border:1px solid #e5e7eb;border-radius:13px;background:#fff;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer}
.card:hover{border-color:#aaa}
.card-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-size:16px;font-weight:800}
.walk{font-size:11px;color:#666;white-space:nowrap}
.address{font-size:11px;color:#888;margin:5px 0 9px}
.menu{font-size:13px;line-height:1.55}
.menu-image{display:block;width:100%;max-height:230px;object-fit:contain;border-radius:8px;background:#f7f7f7}
.text-menu{max-height:190px;overflow:auto;padding-right:3px}
.menu-line{padding:1px 0}
.source{margin-top:7px;font-size:10px;color:#999}
.empty{padding:24px;text-align:center;color:#888;font-size:13px}
.overlay{background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.16);padding:7px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.overlay.office{background:#222;color:#fff;border-color:#222}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}
.modal{width:min(1100px,100%);max-height:90vh;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:15px 18px;border-bottom:1px solid #eee;display:flex;align-items:center}
.modal-title{font-size:18px;font-weight:800}
.close{margin-left:auto;font-size:20px;padding:4px 9px}
.modal-body{padding:15px;overflow:auto}
.modal-cards{display:flex;gap:12px;overflow-x:auto}
.modal-card{flex:0 0 310px;border:1px solid #e5e7eb;border-radius:13px;padding:13px}
.modal-card .menu{margin-top:8px}
@media(max-width:700px){
 header{height:58px;padding:0 12px}.title{font-size:17px}.date{font-size:11px}
 .actions button{padding:8px 9px;font-size:11px}.bottom-panel{padding:9px}
 .card{flex-basis:245px}
}
</style>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_카카오_JavaScript_Key"></script>
</head>
<body>
<div id="app">
<header>
  <div class="title">🍚 가산 점심 메뉴</div>
  <div id="date" class="date">메뉴 불러오는 중...</div>
  <div class="actions">
    <button id="resetBtn">지도 초기화</button>
    <button id="allBtn" class="primary">메뉴 한번에 보기</button>
  </div>
</header>

<div id="map"></div>

<section class="bottom-panel">
  <div id="status" class="status">메뉴 데이터를 불러오는 중입니다.</div>
  <div id="cards" class="cards"><div class="empty">잠시만 기다려 주세요.</div></div>
</section>
</div>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">오늘 가산 식단</div>
      <button class="close" id="closeBtn">×</button>
    </div>
    <div class="modal-body">
      <div id="modalCards" class="modal-cards"></div>
    </div>
  </div>
</div>

<script>
const DEFAULT_CENTER = {lat:37.4776, lng:126.8797};
let map = null;
let initialLevel = 4;
let data = null;
let markers = [];
let overlays = [];

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function menuHtml(r){
  return r.html || '<div class="empty">메뉴 정보가 없습니다.</div>';
}

function cardHtml(r){
  return `
    <div class="card" data-index="${r._index}">
      <div class="card-head">
        <div class="name">${esc(r.name)}</div>
        <div class="walk">🚶 ${esc(r.walk_min)}분 · ${esc(r.dist)}m</div>
      </div>
      <div class="address">${esc(r.address)}</div>
      <div class="menu">${menuHtml(r)}</div>
      <div class="source">${esc(r.source || '')}</div>
    </div>`;
}

function modalCardHtml(r){
  return `
    <div class="modal-card">
      <div class="card-head">
        <div class="name">${esc(r.name)}</div>
        <div class="walk">🚶 ${esc(r.walk_min)}분</div>
      </div>
      <div class="address">${esc(r.address)} · ${esc(r.dist)}m</div>
      <div class="menu">${menuHtml(r)}</div>
      <div class="source">${esc(r.source || '')}</div>
    </div>`;
}

function createMap(){
  if(!window.kakao || !kakao.maps){
    document.getElementById('status').textContent =
      '카카오맵을 불러오지 못했습니다. JavaScript 키와 Web 도메인 설정을 확인해 주세요.';
    return;
  }

  const center = new kakao.maps.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng);
  map = new kakao.maps.Map(document.getElementById('map'), {
    center:center,
    level:initialLevel
  });

  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);

  kakao.maps.event.addListener(map, 'click', () => {});
}

function addLabel(lat,lng,text,cls=''){
  const pos = new kakao.maps.LatLng(lat,lng);
  const ov = new kakao.maps.CustomOverlay({
    position:pos,
    content:`<div class="overlay ${cls}">${esc(text)}</div>`,
    yAnchor:1.75,
    zIndex:3
  });
  ov.setMap(map);
  overlays.push(ov);
}

function clearMapObjects(){
  markers.forEach(m => m.setMap(null));
  overlays.forEach(o => o.setMap(null));
  markers=[]; overlays=[];
}

function renderMap(){
  clearMapObjects();
  if(!data || !data.office || !data.restaurants) return;

  const bounds = new kakao.maps.LatLngBounds();
  const officePos = new kakao.maps.LatLng(data.office.lat, data.office.lng);
  bounds.extend(officePos);

  addLabel(data.office.lat, data.office.lng, '회사', 'office');

  data.restaurants.forEach((r,i)=>{
    r._index=i;
    const pos = new kakao.maps.LatLng(r.lat,r.lng);
    bounds.extend(pos);

    const marker = new kakao.maps.Marker({position:pos});
    marker.setMap(map);
    markers.push(marker);

    addLabel(r.lat,r.lng,r.name);

    kakao.maps.event.addListener(marker,'click',()=>{
      map.panTo(pos);
      const el=document.querySelector(`.card[data-index="${i}"]`);
      if(el){el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
    });
  });

  if(data.restaurants.length){
    map.setBounds(bounds, 60, 60, 60, 60);
    if(map.getLevel() > 5) map.setLevel(5);
  }
}

function renderCards(){
  const cards=document.getElementById('cards');
  if(!data || !data.restaurants || !data.restaurants.length){
    cards.innerHTML='<div class="empty">오늘 메뉴 데이터가 없습니다.</div>';
    return;
  }
  cards.innerHTML=data.restaurants.map(cardHtml).join('');
  cards.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click',()=>{
      const r=data.restaurants[Number(el.dataset.index)];
      map.panTo(new kakao.maps.LatLng(r.lat,r.lng));
    });
  });
}

function renderModal(){
  if(!data || !data.restaurants) return;
  document.getElementById('modalTitle').textContent =
    `${data.date_display || data.date || '오늘'} 가산 식단`;
  document.getElementById('modalCards').innerHTML =
    data.restaurants.map(modalCardHtml).join('');
}

function render(){
  const dateText = data?.date_display || data?.date || '';
  document.getElementById('date').textContent = dateText;
  document.getElementById('status').textContent =
    data?.updated_at
      ? `업데이트 ${data.updated_at} · ${data.restaurants?.length || 0}개 식당`
      : '오늘 메뉴 데이터';
  renderMap();
  renderCards();
  renderModal();
}

async function loadData(){
  try{
    const res=await fetch(`data/menu.json?t=${Date.now()}`,{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    data=await res.json();
    render();
  }catch(e){
    document.getElementById('date').textContent='';
    document.getElementById('status').textContent =
      '오늘 메뉴 데이터가 아직 없습니다. lunchmap.py가 실행되면 자동으로 표시됩니다.';
    document.getElementById('cards').innerHTML =
      '<div class="empty">data/menu.json을 찾을 수 없습니다.</div>';
  }
}

document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!map) return;
  if(data?.office){
    map.setCenter(new kakao.maps.LatLng(data.office.lat,data.office.lng));
    map.setLevel(initialLevel);
  }else{
    map.setCenter(new kakao.maps.LatLng(DEFAULT_CENTER.lat,DEFAULT_CENTER.lng));
    map.setLevel(initialLevel);
  }
});

document.getElementById('allBtn').addEventListener('click',()=>{
  document.getElementById('modalBg').classList.add('show');
});
document.getElementById('closeBtn').addEventListener('click',()=>{
  document.getElementById('modalBg').classList.remove('show');
});
document.getElementById('modalBg').addEventListener('click',e=>{
  if(e.target.id==='modalBg') document.getElementById('modalBg').classList.remove('show');
});

createMap();
loadData();
</script>
</body>
</html>

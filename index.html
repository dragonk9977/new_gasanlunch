<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가산 점심 메뉴 지도</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;color:#222;background:#f5f6f8}body{overflow:hidden}#app{width:100%;height:100%;position:relative}#map{position:absolute;inset:0}
.topbar{position:absolute;top:14px;left:14px;right:14px;z-index:20;display:flex;align-items:center;gap:10px;pointer-events:none}.titlebox{pointer-events:auto;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:14px;padding:11px 14px;box-shadow:0 3px 14px rgba(0,0,0,.12)}.title{font-size:18px;font-weight:800;white-space:nowrap}.date{font-size:11px;color:#777;margin-top:3px;white-space:nowrap}.clockbox{pointer-events:auto;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:14px;padding:8px 12px;box-shadow:0 3px 14px rgba(0,0,0,.12);min-width:0}.clock-date{font-size:11px;color:#777;white-space:nowrap}.clock-time{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px;white-space:nowrap}.clock-countdown{font-size:11px;font-weight:700;color:#e74c3c;margin-top:2px;white-space:nowrap}.ocr-note{font-size:9.5px;color:#aaa;margin-top:3px;white-space:nowrap}.actions{margin-left:auto;display:flex;gap:7px;pointer-events:auto;flex-shrink:0}button{border:1px solid #ddd;background:rgba(255,255,255,.97);border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08);white-space:nowrap}button:hover{background:#f3f4f6}.primary{background:#222;color:#fff;border-color:#222}.primary:hover{background:#000}button .short{display:none}
.map-label{position:relative;background:#fff;border:2px solid #ff6b35;border-radius:11px;padding:9px 14px;box-shadow:0 3px 12px rgba(0,0,0,.18);font-size:15px;font-weight:800;color:#c1440e;white-space:nowrap;cursor:pointer;animation:labelPulse 2.4s ease-in-out infinite}.map-label:hover{transform:translateY(-1px)}.map-label.office{background:#222;color:#fff;border-color:#222;animation:none}
@keyframes labelPulse{0%,100%{box-shadow:0 3px 12px rgba(0,0,0,.18),0 0 0 0 rgba(255,107,53,.5)}50%{box-shadow:0 3px 12px rgba(0,0,0,.18),0 0 0 7px rgba(255,107,53,0)}}
.map-label::after,.map-label::before{content:'';position:absolute;width:0;height:0;border:7px solid transparent}
.map-label.tail-down::before{left:50%;top:100%;margin-left:-7px;border-top-color:#ff6b35}
.map-label.office.tail-down::before{border-top-color:#222}
.map-label.tail-down::after{left:50%;top:100%;margin-left:-7px;margin-top:-1px;border-top-color:#fff}
.map-label.office.tail-down::after{border-top-color:#222}
.map-label.tail-up::before{left:50%;bottom:100%;margin-left:-7px;border-bottom-color:#ff6b35}
.map-label.office.tail-up::before{border-bottom-color:#222}
.map-label.tail-up::after{left:50%;bottom:100%;margin-left:-7px;margin-bottom:-1px;border-bottom-color:#fff}
.map-label.office.tail-up::after{border-bottom-color:#222}
.map-label.tail-left::before{top:50%;right:100%;margin-top:-7px;border-right-color:#ff6b35}
.map-label.office.tail-left::before{border-right-color:#222}
.map-label.tail-left::after{top:50%;right:100%;margin-top:-7px;margin-right:-1px;border-right-color:#fff}
.map-label.office.tail-left::after{border-right-color:#222}
.map-label.tail-right::before{top:50%;left:100%;margin-top:-7px;border-left-color:#ff6b35}
.map-label.office.tail-right::before{border-left-color:#222}
.map-label.tail-right::after{top:50%;left:100%;margin-top:-7px;margin-left:-1px;border-left-color:#fff}
.map-label.office.tail-right::after{border-left-color:#222}
.popup{position:relative;width:min(360px,calc(100vw - 28px));background:#fff;border-radius:15px;border:1px solid #ddd;box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden}.popup-head{display:flex;align-items:center;padding:14px 16px}.accent-dot{width:10px;height:10px;border-radius:50%;margin-right:8px;flex-shrink:0}.popup-name{font-size:19px;font-weight:800;letter-spacing:-.2px;cursor:pointer}.popup-name:hover{text-decoration:underline}.popup-date{margin-left:8px;font-size:11px;font-weight:700;color:#777;background:#f1f1f1;border-radius:6px;padding:3px 7px;white-space:nowrap}.ocr-badge{position:absolute;top:0;z-index:5;background:#b45309;color:#fff;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:0 0 7px 7px;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:help;letter-spacing:.2px;white-space:nowrap}.popup-ocr-badge{right:36px}.modal-ocr-badge{right:12px}.popup-walk{margin-left:auto;font-size:12px;color:#666;white-space:nowrap;font-weight:600}.popup-close{margin-left:8px;border:0;box-shadow:none;padding:2px 7px;font-size:20px;line-height:1;cursor:pointer}.popup-body{padding:14px 16px 16px;max-height:66vh;overflow:auto}.address{font-size:11px;color:#999;margin-bottom:10px}.menu{font-size:14px;line-height:1.6;cursor:pointer}.menu-image{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:9px;background:#f7f7f7}.text-menu{padding:2px 0;display:flex;flex-direction:column;gap:2px}.menu-line{padding:5px 9px;font-size:14px;border-radius:7px}.menu-line.cat-main{font-weight:800;color:#a8380a;font-size:15.5px;background:rgba(193,68,14,.09);margin-bottom:2px}.menu-line.cat-soup{color:#1d4ed8;font-weight:600}.menu-line.cat-side{color:#333}.menu-line.cat-kimchi{color:#0369a1}.menu-line.cat-snack{color:#7e22ce}.menu-line.cat-drink{color:#0f766e}.source{margin-top:10px;font-size:10px;color:#bbb}
.choice-menu{position:relative;width:210px;background:#fff;border-radius:14px;border:1px solid #ddd;box-shadow:0 8px 26px rgba(0,0,0,.22);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}.choice-close{position:absolute;top:6px;right:8px;border:0;box-shadow:none;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:#999;padding:2px 6px}.choice-title{font-size:15px;font-weight:800;margin-bottom:2px;padding-right:20px}.choice-btn{border:1px solid #e5e7eb;background:#f8f8f8;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;text-align:left;cursor:pointer}.choice-btn:hover{background:#eee}.choice-btn:disabled{opacity:.45;cursor:not-allowed}.choice-btn:disabled:hover{background:#f8f8f8}.choice-btn-kakao{color:#1a1a1a}
.notice{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:15;background:rgba(255,255,255,.95);border:1px solid #e5e7eb;border-radius:12px;padding:9px 13px;font-size:12px;color:#777;box-shadow:0 3px 12px rgba(0,0,0,.1);white-space:nowrap}
.visitor-badge{position:absolute;left:12px;bottom:12px;z-index:15;opacity:.85;line-height:0}.visitor-badge:hover{opacity:1}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;align-items:center;justify-content:center;padding:16px}.modal-bg.show{display:flex}.modal{width:min(1180px,100%);max-height:90vh;background:#fff;border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.modal-head{padding:15px 18px;border-bottom:1px solid #eee;display:flex;align-items:center}.modal-title{font-size:18px;font-weight:800}.modal-close{margin-left:auto;border:0;box-shadow:none;font-size:22px;padding:2px 8px;cursor:pointer}.modal-body{padding:15px;overflow:auto}.modal-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.modal-card{position:relative;border:1px solid #e5e7eb;border-radius:13px;padding:14px;min-width:0}.modal-card .card-head{display:flex;align-items:center;gap:2px}.modal-card .name{font-size:16px;font-weight:800;cursor:pointer}.modal-card .name:hover{text-decoration:underline}.modal-card .walk{margin-left:auto;font-size:10px;color:#666;white-space:nowrap;font-weight:600}.modal-card .address{margin-top:6px}.modal-card .menu{margin-top:10px}.modal-card .menu-image{max-height:400px}
@media(max-width:900px){.modal-cards{display:flex;overflow-x:auto}.modal-card{flex:0 0 280px}}@media(max-width:600px){.topbar{top:8px;left:8px;right:8px;flex-direction:column;align-items:stretch;gap:6px}.titlebox{padding:9px 11px}.title{font-size:16px}.date{font-size:10px}.clockbox{padding:6px 10px}.clock-time{font-size:17px}.clock-date{font-size:10px}.clock-countdown{font-size:10px}.ocr-note{font-size:9px;white-space:normal;text-align:center}.actions{margin-left:0;justify-content:flex-end;gap:5px}.actions button{padding:8px 10px;font-size:11px}.notice{bottom:10px;font-size:11px;padding:8px 10px}.popup{width:calc(100vw - 28px)}.popup-body{max-height:54vh}.modal-bg{padding:8px}.modal{max-height:94vh}}
@media(max-width:420px){button .full{display:none}button .short{display:inline}}
</style>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=42e54a502a4ea6b063acba6bbef6ff42"></script>
</head>
<body>
<div id="app"><div id="map"></div>
<div class="topbar"><div class="titlebox"><div class="title">🍚 가산 점심 메뉴</div><div id="date" class="date">메뉴 불러오는 중...</div></div><div id="clockBox" class="clockbox"><div id="clockDate" class="clock-date"></div><div id="clockTime" class="clock-time"></div><div id="clockCountdown" class="clock-countdown"></div><div class="ocr-note">※ 메뉴는 OCR로 자동 인식돼 이름이 부정확할 수 있어요</div></div><div class="actions"><button id="resetBtn"><span class="full">지도 초기화</span><span class="short">초기화</span></button><button id="allBtn" class="primary"><span class="full">메뉴 한번에 보기</span><span class="short">전체보기</span></button></div></div>
<div id="notice" class="notice">5개 식당 위치를 표시합니다. 식당 이름을 눌러 메뉴를 확인하세요.</div>
<a href="https://hits.sh/dragonk9977.github.io/new_gasanlunch/" target="_blank" rel="noopener" class="visitor-badge"><img alt="방문자 수" src="https://hits.sh/dragonk9977.github.io/new_gasanlunch/.svg?style=flat-square&label=방문&color=555555"/></a>
</div>
<div id="error" style="display:none"></div>
<div id="modalBg" class="modal-bg"><div class="modal"><div class="modal-head"><div class="modal-title" id="modalTitle">오늘 가산 식단</div><button class="modal-close" id="closeBtn">×</button></div><div class="modal-body"><div id="modalCards" class="modal-cards"></div></div></div></div>
<script>
const DEFAULT_CENTER={lat:37.4795,lng:126.8820};
const DEFAULT_LEVEL=4; // 기본 확대 레벨 (숫자가 작을수록 확대됨)
let map=null,data=null,markers=[],labels=[],activePopup=null,activeChoice=null,activeRoute=null,initialCenter=null,initialLevel=DEFAULT_LEVEL;

// 식당들이 서로 가까이 붙어있어 라벨이 겹치므로, 마커 기준 라벨을 놓을 방향을 식당별로 지정
// above: 마커 위(기본, 꼬리 아래) / below: 마커 아래(꼬리 위) / left: 마커 왼쪽(꼬리 오른쪽) / right: 마커 오른쪽(꼬리 왼쪽)
const LABEL_LAYOUT={
  '오정':'below',
  '밥심':'left',
  '온정찬':'right',
  '런치타임':'left',
  '런치투게더':'above'
};
const LABEL_ANCHOR={
  above:{xAnchor:.5,yAnchor:1.15,tail:'tail-down'},
  below:{xAnchor:.5,yAnchor:-.15,tail:'tail-up'},
  left:{xAnchor:1.15,yAnchor:.5,tail:'tail-right'},
  right:{xAnchor:-.15,yAnchor:.5,tail:'tail-left'}
};

// 점심시간 기준 (필요하면 이 두 줄만 바꾸면 됩니다)
const LUNCH_START={h:12,m:0};
const LUNCH_END={h:13,m:0};

function pad(n){return String(n).padStart(2,'0')}
function updateClock(){
  const now=new Date();
  const wd=['일','월','화','수','목','금','토'][now.getDay()];
  document.getElementById('clockDate').textContent=`${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${wd})`;
  document.getElementById('clockTime').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  const start=new Date(now); start.setHours(LUNCH_START.h,LUNCH_START.m,0,0);
  const end=new Date(now); end.setHours(LUNCH_END.h,LUNCH_END.m,0,0);

  let label,diffMs;
  if(now<start){ label='점심시간까지'; diffMs=start-now; }
  else if(now<end){ label='점심시간 종료까지'; diffMs=end-now; }
  else{ const next=new Date(start); next.setDate(next.getDate()+1); label='내일 점심시간까지'; diffMs=next-now; }

  const totalSec=Math.max(0,Math.floor(diffMs/1000));
  const h=Math.floor(totalSec/3600),m=Math.floor((totalSec%3600)/60),s=totalSec%60;
  document.getElementById('clockCountdown').textContent=`${label} ${h}시간 ${pad(m)}분 ${pad(s)}초`;
}
updateClock();
setInterval(updateClock,1000);

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function menuHtml(r){return r.html||'<div>오늘의 메뉴가 아직 없습니다.</div>'}
function formatMenuDateShort(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  const wd=['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${wd})`;
}
function resetMap(){if(!map||!initialCenter)return;map.setCenter(initialCenter);map.setLevel(initialLevel)}
function clearRoute(){if(activeRoute){activeRoute.setMap(null);activeRoute=null}}
function closePopup(){if(activePopup){activePopup.setMap(null);activePopup=null}clearRoute();resetMap()}
function closeChoice(){if(activeChoice){activeChoice.setMap(null);activeChoice=null}}

function openChoiceMenu(r){
  closeChoice();
  if(activePopup){activePopup.setMap(null);activePopup=null;clearRoute()}

  const hasRaw = !!(r.raw_ref && r.raw_ref.url);
  const pos=new kakao.maps.LatLng(r.lat,r.lng);
  const wrapper=document.createElement('div');
  wrapper.className='choice-menu';
  wrapper.innerHTML=`
    <button class="choice-close" type="button">×</button>
    <div class="choice-title">${esc(r.name)}</div>
    <button class="choice-btn choice-btn-menu" type="button" ${hasRaw?'':'disabled'}>📋 메뉴 원본 보기${hasRaw?'':' (없음)'}</button>
    <button class="choice-btn choice-btn-kakao" type="button">📍 카카오맵 바로가기</button>
  `;
  wrapper.querySelector('.choice-close').addEventListener('click',closeChoice);
  wrapper.querySelector('.choice-btn-menu').addEventListener('click',()=>{
    closeChoice();
    openRawView(r);
  });
  wrapper.querySelector('.choice-btn-kakao').addEventListener('click',()=>{
    const url=KAKAO_PLACE_URLS[r.name];
    if(url) window.open(url,'_blank','noopener');
    closeChoice();
  });

  activeChoice=new kakao.maps.CustomOverlay({
    position:pos,
    content:wrapper,
    xAnchor:-0.05,
    yAnchor:0.5,
    zIndex:20,
    clickable:true
  });
  activeChoice.setMap(map);
  map.panTo(pos);
  if(map.relayout) map.relayout();
}

function openRawView(r){
  const ref=r.raw_ref;
  if(!ref||!ref.url){ alert('아직 확인된 원본이 없어요.'); return; }

  if(ref.type==='link'){
    window.open(ref.url,'_blank','noopener');
    return;
  }

  if(activePopup){ activePopup.setMap(null); activePopup=null; }
  clearRoute();
  drawRoute(r);

  const accent=accentColor(r.name);
  const pos=new kakao.maps.LatLng(r.lat,r.lng);
  const wrapper=document.createElement('div');
  wrapper.className='popup';
  wrapper.innerHTML=`
    <div class="popup-head" style="border-bottom:3px solid ${accent}">
      <span class="accent-dot" style="background:${accent}"></span>
      <div class="popup-name">${esc(r.name)} 원본</div>
      <button class="popup-close" type="button">×</button>
    </div>
    <div class="popup-body">
      <img src="${ref.url}" class="menu-image" alt="${esc(r.name)} 원본 이미지">
      <div class="source" style="margin-top:8px">OCR로 인식하기 전 원본 이미지예요. 메뉴 이름이 이상해 보이면 여기서 직접 확인해보세요.</div>
    </div>
  `;
  wrapper.querySelector('.popup-close').addEventListener('click',closePopup);
  wrapper.querySelector('.menu-image').addEventListener('click',closePopup);
  const bodyEl=wrapper.querySelector('.popup-body');
  if(bodyEl) bodyEl.addEventListener('wheel', e => e.stopPropagation());

  const isNarrow = window.innerWidth <= 600;

  activePopup = new kakao.maps.CustomOverlay({
    position: pos,
    content: wrapper,
    xAnchor: isNarrow ? -0.05 : -0.35,
    yAnchor: 0.12,
    zIndex: 20,
    clickable: true
  });

  activePopup.setMap(map);
  map.panTo(pos);
  if(map.relayout) map.relayout();

  if(!isNarrow){
    setTimeout(() => { if(map) map.panBy(200, 0); }, 150);
  }
}

// 식당별 포인트 컬러 — 팝업/카드 헤더에 표시
const ACCENT_COLORS={
  '오정':'#d4a017',
  '온정찬':'#16a34a',
  '런치투게더':'#1e3a8a',
  '런치타임':'#ea580c',
  '밥심':'#7c3aed'
};
function accentColor(name){return ACCENT_COLORS[name]||'#666'}

const KAKAO_PLACE_URLS={
  '오정':'https://place.map.kakao.com/743883728',
  '온정찬':'https://place.map.kakao.com/1848680699',
  '런치투게더':'https://place.map.kakao.com/544428179',
  '런치타임':'https://place.map.kakao.com/947488989',
  '밥심':'https://place.map.kakao.com/1458594857'
};

function popupHtml(r){
  const accent=accentColor(r.name);
  const dateShort=formatMenuDateShort(r.menu_date);
  const isOcr=r.source==='gemini_ocr'||r.source==='openrouter_ocr';
  const ocrTip='OCR로 자동 인식한 메뉴명이라 실제와 다르게 표기될 수 있어요. 정확한 메뉴는 원본 게시물을 확인해주세요.';
  const sourceLine=[r.source||'', r.checked_at?`${r.checked_at} 확인`:''].filter(Boolean).join(' · ');
  return `<div class="popup">
    ${isOcr?`<span class="ocr-badge popup-ocr-badge" title="${esc(ocrTip)}">ⓘ OCR 인식</span>`:''}
    <div class="popup-head" style="border-bottom:3px solid ${accent}">
      <span class="accent-dot" style="background:${accent}"></span>
      <div class="popup-name">${esc(r.name)}</div>
      ${dateShort?`<div class="popup-date">${esc(dateShort)}</div>`:''}
      <div class="popup-walk">🚶 ${esc(r.walk_min)}분 · ${esc(r.dist)}m</div>
      <button class="popup-close" onclick="closePopup()">×</button>
    </div>
    <div class="popup-body">
      <div class="address">${esc(r.address)}</div>
      <div class="menu">${menuHtml(r)}</div>
      <div class="source">${esc(sourceLine)}</div>
    </div>
  </div>`
}

function drawRoute(r){
  clearRoute();
  if(!r.route || !r.route.length) return;
  const path=r.route.map(p=>new kakao.maps.LatLng(p.lat,p.lng));
  activeRoute=new kakao.maps.Polyline({
    path,
    strokeWeight:5,
    strokeColor:'#2563eb',
    strokeOpacity:.85,
    strokeStyle:'solid'
  });
  activeRoute.setMap(map);
}

function openPopup(r){
  if(activePopup){ activePopup.setMap(null); activePopup=null; }
  const pos = new kakao.maps.LatLng(r.lat, r.lng);

  drawRoute(r);

  // 메뉴(이미지/텍스트) 부분을 눌러도 팝업이 닫히도록, 문자열 대신 DOM 엘리먼트로 생성
  const wrapper=document.createElement('div');
  wrapper.innerHTML=popupHtml(r);
  const menuEl=wrapper.querySelector('.menu');
  if(menuEl) menuEl.addEventListener('click',closePopup);

  // 팝업 안의 식당 이름을 누르면 "메뉴 원본 보기 / 카카오맵 바로가기" 선택지를 띄움
  const nameEl=wrapper.querySelector('.popup-name');
  if(nameEl) nameEl.addEventListener('click', e => { e.stopPropagation(); openChoiceMenu(r); });

  // 팝업 안에서 마우스 휠을 스크롤로만 쓰고, 지도 확대/축소로 새지 않게 막음
  const bodyEl=wrapper.querySelector('.popup-body');
  if(bodyEl) bodyEl.addEventListener('wheel', e => e.stopPropagation());

  // 화면이 좁으면(모바일) 팝업이 어차피 거의 꽉 차게 뜨므로, 마커를 오른쪽으로 멀리 안 밀어도 됨.
  // 넓은 화면(데스크톱)에서만 마커 기준 오른쪽으로 멀찍이 띄워서 경로 선이 안 가리게 함
  const isNarrow = window.innerWidth <= 600;

  activePopup = new kakao.maps.CustomOverlay({
    position: pos,
    content: wrapper,
    xAnchor: isNarrow ? -0.05 : -0.35,
    yAnchor: 0.12,
    zIndex: 20,
    clickable: true
  });
  
  activePopup.setMap(map);
  map.panTo(pos);
  if(map.relayout) map.relayout();
  
  if(!isNarrow){
    // 팝업이 우측으로 더 멀리 나타나므로, 화면도 그만큼 더 밀어줌 (좁은 화면에선 생략 — 마커가 화면 밖으로 밀려남)
    setTimeout(() => {
      if(map) map.panBy(200, 0);
    }, 150);
  }
}

function addLabel(lat,lng,text,clickFn,cls='',pos='above'){
  const a=LABEL_ANCHOR[pos]||LABEL_ANCHOR.above;
  const el=document.createElement('div');
  el.className=`map-label ${a.tail} ${cls}`.trim();
  el.textContent=text;
  el.addEventListener('click',clickFn);
  const ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(lat,lng),content:el,xAnchor:a.xAnchor,yAnchor:a.yAnchor,zIndex:10,clickable:true});
  ov.setMap(map);
  labels.push(ov);
}
function clearObjects(){markers.forEach(m=>m.setMap(null));labels.forEach(o=>o.setMap(null));markers=[];labels=[];if(activePopup){activePopup.setMap(null);activePopup=null}closeChoice();clearRoute()}
function createMap(){if(!window.kakao||!kakao.maps){document.getElementById('notice').textContent='카카오맵을 불러오지 못했습니다. JavaScript 키와 Web 도메인 설정을 확인해 주세요.';return false}map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(DEFAULT_CENTER.lat,DEFAULT_CENTER.lng),level:DEFAULT_LEVEL});map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);map.addControl(new kakao.maps.MapTypeControl(),kakao.maps.ControlPosition.TOPRIGHT);return true}

function renderMap(){
  clearObjects();
  if(!data?.office||!data?.restaurants?.length)return;

  const bounds=new kakao.maps.LatLngBounds();
  bounds.extend(new kakao.maps.LatLng(data.office.lat,data.office.lng));

  data.restaurants.forEach(r=>{
    bounds.extend(new kakao.maps.LatLng(r.lat,r.lng));
    const pos=new kakao.maps.LatLng(r.lat,r.lng);
    const marker=new kakao.maps.Marker({position:pos});
    marker.setMap(map);
    markers.push(marker);
    addLabel(r.lat,r.lng,r.name,()=>openPopup(r),'',LABEL_LAYOUT[r.name]||'above');
    kakao.maps.event.addListener(marker,'click',()=>openPopup(r));
  });

  addLabel(data.office.lat,data.office.lng,'회사',resetMap,'office','above');

  // 1. 식당과 회사가 한눈에 보이게 영역 자동 설정 (상하좌우 60px 여백 추가)
  map.setBounds(bounds, 60, 60, 60, 60);

  // 2. 만약 자동 설정된 줌 아웃 레벨이 4보다 크면(너무 멀면) 레벨 4로 강제 줌인
  setTimeout(() => {
    if(map.getLevel() > 4) {
      map.setLevel(4);
    }
    // 현재 맞춰진 최적의 중심점과 확대 레벨을 초기값으로 저장 (초기화 버튼 용)
    initialCenter=map.getCenter();
    initialLevel=map.getLevel();
  }, 100);
}

function modalCard(r){const accent=accentColor(r.name);const dateShort=formatMenuDateShort(r.menu_date);const isOcr=r.source==='gemini_ocr'||r.source==='openrouter_ocr';const ocrTip='OCR로 자동 인식한 메뉴명이라 실제와 다르게 표기될 수 있어요. 정확한 메뉴는 원본 게시물을 확인해주세요.';const sourceLine=[r.source||'', r.checked_at?`${r.checked_at} 확인`:''].filter(Boolean).join(' · ');return `<div class="modal-card" style="border-top:3px solid ${accent}">${isOcr?`<span class="ocr-badge modal-ocr-badge" title="${esc(ocrTip)}">ⓘ OCR 인식</span>`:''}<div class="card-head"><span class="accent-dot" style="background:${accent}"></span><div class="name" data-name="${esc(r.name)}">${esc(r.name)}</div>${dateShort?`<div class="popup-date">${esc(dateShort)}</div>`:''}<div class="walk">🚶 ${esc(r.walk_min)}분</div></div><div class="address">${esc(r.address)} · ${esc(r.dist)}m</div><div class="menu">${menuHtml(r)}</div><div class="source">${esc(sourceLine)}</div></div>`}
function closeModal(){document.getElementById('modalBg').classList.remove('show');resetMap()}
function renderModal(){document.getElementById('modalTitle').textContent=`${data?.date_display||data?.date||'오늘'} 가산 식단`;document.getElementById('modalCards').innerHTML=(data?.restaurants||[]).map(modalCard).join('');document.querySelectorAll('#modalCards .menu').forEach(el=>el.addEventListener('click',closeModal));document.querySelectorAll('#modalCards .name').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const r=(data?.restaurants||[]).find(x=>x.name===el.dataset.name);if(r){closeModal();openChoiceMenu(r);}}))}
async function loadData(){try{const res=await fetch(`data/menu.json?t=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(res.status);data=await res.json();document.getElementById('date').textContent=`${data.date_display||data.date||''} · 최종 업데이트 ${data.updated_at_display||data.updated_at||''}`;renderMap();renderModal()}catch(e){document.getElementById('date').textContent='메뉴 데이터 준비 중';document.getElementById('notice').textContent='아직 오늘 메뉴 데이터가 없습니다.'}}
document.getElementById('resetBtn').addEventListener('click',()=>{closeChoice();closePopup()});document.getElementById('allBtn').addEventListener('click',()=>{if(activePopup){activePopup.setMap(null);activePopup=null}closeChoice();clearRoute();document.getElementById('modalBg').classList.add('show')});document.getElementById('closeBtn').addEventListener('click',closeModal);document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg'){closeModal()}});document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const modal=document.getElementById('modalBg');if(modal.classList.contains('show')){closeModal();return}if(activeChoice){closeChoice();resetMap();return}if(activePopup){closePopup()}});if(createMap())loadData();
</script>
</body></html>
